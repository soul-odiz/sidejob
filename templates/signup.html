{% extends 'base.html' %}

{% block content %}
<style>
    label {
        display: inline-block;
        width: 150px;
        text-align: right;
        margin-right: 0px;
        margin-bottom: 10px;
        margin-left: -52px;
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=number],
    textarea {
        width: 220px;
        height: 35px;
        margin-bottom: 10px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-align: right;
    }

    textarea {
        height: 100px;
        resize: none;
    }

    button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #87779F;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #333;
    }

    form {
        margin-top: 75px;
        text-align: center;
    }

    #crew_member_info {
        display: none;
        margin-top: 20px;
        text-align: center;
    }

    h4 {
        margin-bottom: 10px;
    }
    h1 {
        padding: 10px 25px;
        margin-top: 50px;
        background: #87779F;
        color: #fff;
        border-radius: 12px 12px 0 0;
        text-align: center;
    }
    .profession-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin: 10px auto;
        max-width: 500px;
    }
    .profession-option {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .profession-option label {
        width: auto;
        margin: 0;
        font-size: 13px;
    }
    .profession-option input {
        width: auto;
        margin: 0;
    }
</style>

<form method="post" action="{{ url_for('signup') }}" enctype="multipart/form-data">
    <h1>:צור חשבון</h1>
    <div>
        <input type="text" id="username" name="username" required>
        <label for="username">:שם משתמש</label>
        <br>
        <input type="email" id="email" name="email" required>
        <label for="email">:אימייל</label>
        <br>
        <input type="password" id="password" name="password" required>
        <label for="password">:סיסמה</label>
        <br>
        <input type="text" id="first_name" name="first_name" required>
        <label for="first_name">:שם פרטי</label>
        <br>
        <input type="text" id="last_name" name="last_name" required>
        <label for="last_name">:שם משפחה</label>
        <br>
        <input type="text" id="phone" name="phone">
        <label for="phone">:טלפון</label>
        <br>
        <input type="checkbox" name="is_crew_member" id="is_crew_member">
        <label for="is_crew_member">:הרשם כעצמאי</label>
        <br>
    </div>
    <div id="crew_member_info">
        <h4>פרטים לעסק/שירות</h4>
        <input type="text" id="name" name="name">
        <label for="name">:שם העסק/שירות</label>
        <br>
        <textarea id="bio" name="bio" placeholder="ספר/י על עצמך ועל השירותים שאת/ה מציע/ה"></textarea>
        <label for="bio">:אודות</label>
        <br>
        <input type="number" id="hourly_fee" name="hourly_fee" step="0.01" placeholder="לדוגמה: 100">
        <label for="hourly_fee">:מחיר לשעה (₪)</label>
        <br>
        <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
        <label for="profile_picture">:תמונת פרופיל</label>
        <br>
        <input type="text" id="location" name="location" placeholder="תל אביב">
        <label for="location">:מיקום</label>
        <br>
        <input type="text" id="cm_phone" name="cm_phone">
        <label for="cm_phone">:טלפ לקבלת הזמנות</label>
        <br>
        
        <h4>בחר/י את סוגי השירותים שאת/ה מציע/ה:</h4>
        <div class="profession-grid">
            {% for prof in professions %}
            <div class="profession-option">
                <input type="checkbox" id="prof_{{ prof.id }}" name="professions" value="{{ prof.id }}">
                <label for="prof_{{ prof.id }}">{{ prof.name }}</label>
            </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit">צור חשבון</button>
</form>

<script>
    document.getElementById('is_crew_member').addEventListener('change', function() {
        var crewMemberInfo = document.getElementById('crew_member_info');
        crewMemberInfo.style.display = this.checked ? 'block' : 'none';
    });
</script>

{% endblock %}
