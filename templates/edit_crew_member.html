{% extends 'base.html' %}

{% block content %}
<style>
    body { font-family: Arial, sans-serif; background-color: #f2f2f2; }
    .container { background-color: #fff; max-width: 800px; width: 90%; margin: 70px auto; padding: 20px; border-radius: 5px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 30px; }
    form { display: flex; flex-direction: column; }
    .form-group { margin-bottom: 1em; }
    .form-group label { color: #666; margin-bottom: .5em; display: block; }
    .form-group input, .form-group textarea { padding: .5em; border: 1px solid #ddd; border-radius: .25em; width: 100%; box-sizing: border-box; }
    .btn { padding: .5em 1em; background-color: #87779F; color: white; border-radius: .25em; border: none; cursor: pointer; text-align: center; margin-top: 1em; }
    .btn:hover { background-color: #333; }
    .btn-link { background: none; color: #87779F; text-decoration: underline; cursor: pointer; border: none; }
    h4 { padding: 10px 25px; margin-top: 50px; background: #87779F; color: #fff; border-radius: 12px 12px 0 0; text-align: center; }
    .profession-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
    .profession-option { display: flex; align-items: center; gap: 4px; }
    .profession-option label { width: auto; margin: 0; font-size: 13px; }
</style>
<h4>ערוך פרטי חבר צוות</h4>
<div class="container">
    <h1>ערוך {{ crew_member.name }}</h1>
    <form action="{{ url_for('edit_crew_member', crew_member_id=crew_member.id) }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">שם</label>
            <input type="text" id="name" name="name" value="{{ crew_member.name }}" required>
        </div>
        <div class="form-group">
            <label for="bio">אודות</label>
            <textarea id="bio" name="bio" rows="3">{{ crew_member.bio }}</textarea>
        </div>
        <div class="form-group">
            <label for="hourly_fee">שכר שעתי ₪</label>
            <input type="number" id="hourly_fee" name="hourly_fee" step="0.01" value="{{ crew_member.hourly_fee }}" required>
        </div>
        <div class="form-group">
            <label for="profile_picture">תמונת פרופיל</label>
            <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
            {% if crew_member.profile_picture %}
            <div style="margin-top:5px;">
                <img src="{{ crew_member.profile_picture }}" alt="תמונה נוכחית" style="max-width:100px;max-height:100px;border-radius:5px;">
                <p style="font-size:12px;color:#666;">תמונה נוכחית. בחר קובץ חדש להחלפה.</p>
            </div>
            {% endif %}
        </div>
        <div class="form-group">
            <label for="location">מיקום</label>
            <input type="text" id="location" name="location" value="{{ crew_member.location or '' }}">
        </div>
        <div class="form-group">
            <label for="phone">טלפון</label>
            <input type="text" id="phone" name="phone" value="{{ crew_member.phone or '' }}">
        </div>
        <div class="form-group">
            <label for="available">זמינות</label>
            <input type="checkbox" id="available" name="available" {% if crew_member.available %}checked{% endif %}>
        </div>
        <button type="submit" class="btn">עדכן</button>
    </form>
    <p style="text-align:center;margin-top:20px;">
        <a href="{{ url_for('crew_member_profile', crew_member_id=crew_member.id) }}" style="color:#87779F;">↩️ חזרה לפרופיל</a>
        | <a href="{{ url_for('edit_working_hours', crew_member_id=crew_member.id) }}" style="color:#87779F;">⚙️ הגדר שעות עבודה</a>
    </p>
</div>
{% endblock %}
